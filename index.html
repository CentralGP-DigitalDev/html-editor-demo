<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HTML editor demo</title>
    <link rel="icon" type="image/svg+xml" href="./sample.svg" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #20242a; background: #fafafa; font-family: system-ui, sans-serif; }
      main { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
      p { line-height: 1.6; }
      .demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0; }
      .demo-controls button, select { padding: 8px 12px; max-width: 100%; font: inherit; }
      iframe { width: 100%; min-height: 220px; border: 1px solid #d5d8dc; background: white; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./demo.js"></script>
  </body>
</html>
