<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HTML editor demo</title>
    <link rel="icon" type="image/svg+xml" href="./sample.svg" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #20242a; background: #fafafa; font-family: system-ui, sans-serif; }
      main { max-width: 1440px; margin: 32px auto; border: 1px solid #d5d8dc; border-radius: 8px; background: white; }
      .demo-heading, .demo-controls, .demo-panels, footer { padding: 20px; }
      h1 { margin: 0; font-size: 22px; }
      .demo-heading p { margin: 6px 0 0; color: #555; }
      .demo-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border-block: 1px solid #e5e5e5; }
      .demo-controls button, .demo-controls select { padding: 8px 14px; max-width: 100%; font: inherit; border: 1px solid #ccc; border-radius: 6px; background: white; cursor: pointer; }
      .demo-panels { --panel-height: clamp(252px, 39vh, 408px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
      .demo-panels section { min-width: 0; }
      .demo-panels .html-source-editor .html-source-header, .demo-preview h2 { min-height: 34px; margin: 0 0 8px; font: 600 15px/32px system-ui, sans-serif; }
      .demo-panels .html-source-frame { display: flex; flex-direction: column; height: var(--panel-height); }
      .demo-panels .html-source-frame > * { flex-shrink: 0; }
      .demo-panels .html-source-frame > .html-source-visual-content { flex: 1; min-height: 0; overflow: auto; }
      .demo-panels .html-source-editor textarea { flex: 1; min-height: 0; max-height: none; resize: none; }
      .demo-panels .html-source-editor .tiptap { min-height: 100%; max-height: none; }
      .demo-preview { display: flex; flex-direction: column; }
      iframe { width: 100%; height: var(--panel-height); border: 1px solid #c6c9ce; border-radius: 6px; background: white; }
      footer { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; border-top: 1px solid #e5e5e5; font-size: 12px; color: #555; }
      .demo-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @media (max-width: 760px) {
        main { margin: 12px; }
        .demo-heading, .demo-controls, .demo-panels, footer { padding: 14px; }
        .demo-panels { --panel-height: 252px; grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./demo.js"></script>
  </body>
</html>
